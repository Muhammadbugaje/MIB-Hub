<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex">
<title>{{ title }}</title>
<style>
  body { font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; color: #111; background: #fff; margin: 0; padding: 24px 16px 60px; }
  main { max-width: 980px; margin: 0 auto; } h1 { margin: 0 0 4px; font-size: 24px; } .muted { color: #555; font-size: 12.5px; }
  table { width: 100%; border-collapse: collapse; margin: 10px 0; } th, td { border: 1px solid #c9ced6; padding: 6px 9px; text-align: left; vertical-align: top; }
  th { background: #1f2937; color: #fff; font-size: 12px; }
  .bar { display: flex; gap: 10px; margin: 0 0 18px; } button, .bar a { font: 600 14px inherit; padding: 9px 14px; border-radius: 9px; border: 1px solid #111; background: #111; color: #fff; text-decoration: none; cursor: pointer; }
  .bar a { background: #fff; color: #111; } @media print { .bar { display: none; } body { padding: 0; } }
</style></head><body><main>
  <div class="bar"><button type="button" onclick="window.print()">Print or save as PDF</button><a href="{% url 'games:settings_sounds' %}">Back</a></div>
  <h1>{{ title }}</h1>
  <p class="muted">Exported {{ when|date:"l j F Y, H:i" }} by {{ who }}.</p>
  {% if rows %}<table><thead><tr>{% for h in head %}<th>{{ h }}</th>{% endfor %}</tr></thead>
  <tbody>{% for r in rows %}<tr>{% for c in r %}<td>{{ c }}</td>{% endfor %}</tr>{% endfor %}</tbody></table>
  {% else %}<p>No sound has been replaced for everyone.</p>{% endif %}
</main></body></html>
