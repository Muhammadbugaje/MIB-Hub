{% extends "base_auth.html" %}{% load ee_tags %}
{% block title %}Password saved{% endblock %}
{% block content %}
<div class="fp">
  <div class="fp-badge" aria-hidden="true">{% icon "circle-check-big" 24 %}</div>
  <h1>Password saved</h1>
  <p class="lead">You can now sign in with your new password.</p>
  <a class="btn btn-primary btn-lg fp-submit" href="{% url 'accounts:login' %}">{% icon "log-in" 18 %} Sign in</a>
</div>
{% endblock %}
