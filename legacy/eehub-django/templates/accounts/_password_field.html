{% load ee_tags %}<div class="ee-field{% if field.errors %} has-error{% endif %}">
  <label for="{{ field.id_for_label }}">{{ label|default:field.label }}</label>
  <div class="pw-input">
    {{ field }}
    <button type="button" class="pw-toggle" data-pw-toggle="{{ field.id_for_label }}" aria-label="Show password" aria-pressed="false">
      <span class="pw-toggle__show">{% icon "eye" 18 %}</span><span class="pw-toggle__hide">{% icon "eye-off" 18 %}</span>
    </button>
  </div>
  {% if meter %}<div class="pw-meter" data-pw-meter data-score="0" aria-hidden="true"><span></span><span></span><span></span><span></span></div>
  <div class="pw-meter__label" data-pw-label aria-live="polite">Strength shows as you type</div>{% endif %}
  {% if match %}<div class="pw-match" data-pw-match aria-live="polite"></div>{% endif %}
  {% if field.errors %}<ul class="pw-errors" role="alert">{% for e in field.errors %}<li>{{ e }}</li>{% endfor %}</ul>{% endif %}
</div>
